[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diamondclock-lab"
version = "0.1.0"
description = "Research-traceable conditional NV-center frequency stability simulator"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy==2.3.5", "scipy==1.17.0", "pandas==2.2.3",
  "matplotlib==3.10.8", "plotly==7.1.0", "streamlit==1.66.0"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "allantools==2024.6"]

[project.scripts]
diamondclock-clock = "diamondclock.clock_cli:main"

[tool.setuptools.packages.find]
include = ["diamondclock*"]
exclude = ["diamondclock._assets*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
